<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel | Studio Mari Pisani</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            padding: 20px;
            margin: 0;
            color: #333;
        }


        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }


        h2 {
            margin: 0;
            color: #2c3e50;
        }


        .cabecalho {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }


        .btn-atualizar {
            padding: 9px 14px;
            border: none;
            border-radius: 5px;
            background: #2c3e50;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
        }


        .btn-atualizar:hover {
            background: #1f2d3a;
        }


        .tabela-container {
            width: 100%;
            overflow-x: auto;
        }


        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            min-width: 800px;
        }


        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            vertical-align: middle;
        }


        th {
            background: #2c3e50;
            color: #fff;
        }


        tbody tr:hover {
            background: #f8f9fa;
        }


        .btn {
            padding: 8px 12px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            margin-right: 5px;
            margin-bottom: 5px;
        }


        .btn-confirm {
            background: #28a745;
            color: white;
        }


        .btn-confirm:hover {
            background: #218838;
        }


        .btn-cancel {
            background: #dc3545;
            color: white;
        }


        .btn-cancel:hover {
            background: #c82333;
        }


        .status-pendente {
            color: #f39c12;
            font-weight: bold;
        }


        .status-confirmado {
            color: #28a745;
            font-weight: bold;
        }


        .status-cancelado {
            color: #dc3545;
            font-weight: bold;
            text-decoration: line-through;
        }


        .loading {
            text-align: center;
            padding: 25px;
            color: #666;
        }


        .erro {
            text-align: center;
            padding: 25px;
            color: #dc3545;
            font-weight: bold;
        }


        .sem-agendamentos {
            text-align: center;
            padding: 25px;
            color: #666;
        }


        .cliente-nome {
            font-weight: bold;
        }


        .cliente-telefone {
            color: #777;
            font-size: 12px;
        }


        @media (max-width: 768px) {

            body {
                padding: 10px;
            }


            .container {
                padding: 15px;
            }


            .cabecalho {
                align-items: flex-start;
            }


            .btn-atualizar {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <div class="cabecalho">

            <h2>
                Gerenciar Agendamentos
            </h2>


            <button
                type="button"
                class="btn-atualizar"
                onclick="carregarAgendamentos()"
            >
                🔄 Atualizar
            </button>

        </div>


        <div class="tabela-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            Data
                        </th>

                        <th>
                            Horário
                        </th>

                        <th>
                            Cliente
                        </th>

                        <th>
                            Serviço
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Ações
                        </th>

                    </tr>

                </thead>


                <tbody id="lista-agendamentos">

                    <tr>

                        <td
                            colspan="6"
                            class="loading"
                        >
                            Carregando agendamentos...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>



    <script>


        // =========================================================
        // CONFIGURAÇÃO DA API
        // =========================================================

        const API_URL =
            'https://supabase-studio-mari-api.qc3krt.easypanel.host';



        // =========================================================
        // ELEMENTO DA TABELA
        // =========================================================

        const tbody =
            document.getElementById('lista-agendamentos');



        // =========================================================
        // CARREGAR AGENDAMENTOS
        // =========================================================

        async function carregarAgendamentos() {

            tbody.innerHTML = `
                <tr>
                    <td colspan="6" class="loading">
                        Carregando agendamentos...
                    </td>
                </tr>
            `;


            try {


                const res = await fetch(
                    `${API_URL}/api/appointments`,
                    {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json'
                        }
                    }
                );


                if (!res.ok) {

                    throw new Error(
                        `Erro HTTP ${res.status}`
                    );

                }


                const agendamentos = await res.json();


                console.log(
                    'Agendamentos recebidos:',
                    agendamentos
                );


                tbody.innerHTML = '';



                // =================================================
                // NENHUM AGENDAMENTO
                // =================================================

                if (
                    !Array.isArray(agendamentos) ||
                    agendamentos.length === 0
                ) {

                    tbody.innerHTML = `
                        <tr>
                            <td
                                colspan="6"
                                class="sem-agendamentos"
                            >
                                Nenhum agendamento encontrado.
                            </td>
                        </tr>
                    `;

                    return;

                }



                // =================================================
                // CRIAR LINHAS
                // =================================================

                agendamentos.forEach(
                    function (ag) {


                        // -----------------------------------------
                        // DATA
                        // -----------------------------------------

                        let dataFormatada = '-';


                        if (ag.date) {

                            const partesData =
                                String(ag.date).split('-');


                            if (partesData.length === 3) {

                                dataFormatada =
                                    `${partesData[2]}/${partesData[1]}/${partesData[0]}`;

                            }

                            else {

                                dataFormatada =
                                    ag.date;

                            }

                        }



                        // -----------------------------------------
                        // HORÁRIO
                        // -----------------------------------------

                        let horarioFormatado = '-';


                        if (ag.time) {

                            horarioFormatado =
                                String(ag.time).substring(0, 5);

                        }



                        // -----------------------------------------
                        // STATUS
                        // -----------------------------------------

                        const status =
                            ag.status || 'pendente';


                        const statusTexto =
                            String(status).toUpperCase();



                        // -----------------------------------------
                        // LINHA
                        // -----------------------------------------

                        const tr =
                            document.createElement('tr');



                        tr.innerHTML = `

                            <td>
                                ${dataFormatada}
                            </td>


                            <td>
                                ${horarioFormatado}
                            </td>


                            <td>

                                <span class="cliente-nome">
                                    ${ag.name || '-'}
                                </span>

                                <br>

                                <span class="cliente-telefone">
                                    ${ag.phone || '-'}
                                </span>

                            </td>


                            <td>
                                ${ag.services || '-'}
                            </td>


                            <td class="status-${status}">
                                ${statusTexto}
                            </td>


                            <td>


                                ${
                                    status === 'pendente'

                                    ?

                                    `
                                    <button
                                        type="button"
                                        class="btn btn-confirm"
                                        onclick="mudarStatus(
                                            '${ag.id}',
                                            'confirmado'
                                        )"
                                    >
                                        ✅ Confirmar
                                    </button>
                                    `

                                    :

                                    ''
                                }



                                ${
                                    status !== 'cancelado'

                                    ?

                                    `
                                    <button
                                        type="button"
                                        class="btn btn-cancel"
                                        onclick="mudarStatus(
                                            '${ag.id}',
                                            'cancelado'
                                        )"
                                    >
                                        ❌ Cancelar
                                    </button>
                                    `

                                    :

                                    ''
                                }


                            </td>

                        `;


                        tbody.appendChild(tr);

                    }
                );


            }

            catch (error) {


                console.error(
                    'Erro ao buscar agendamentos:',
                    error
                );


                tbody.innerHTML = `

                    <tr>

                        <td
                            colspan="6"
                            class="erro"
                        >

                            Erro ao carregar os agendamentos.

                            <br><br>

                            Verifique a conexão com a API.

                            <br>

                            <small>
                                ${error.message}
                            </small>

                        </td>

                    </tr>

                `;

            }

        }



        // =========================================================
        // ALTERAR STATUS DO AGENDAMENTO
        // =========================================================

        async function mudarStatus(
            id,
            novoStatus
        ) {


            const mensagem =
                novoStatus === 'confirmado'

                ?

                'Deseja realmente confirmar este agendamento?'

                :

                'Deseja realmente cancelar este agendamento?';



            if (!confirm(mensagem)) {

                return;

            }



            try {


                const res = await fetch(

                    `${API_URL}/api/appointments/${id}/status`,

                    {

                        method: 'PUT',

                        headers: {

                            'Content-Type':
                                'application/json',

                            'Accept':
                                'application/json'

                        },

                        body: JSON.stringify({

                            status:
                                novoStatus

                        })

                    }

                );



                if (!res.ok) {


                    const resposta =
                        await res.text();


                    console.error(
                        'Resposta da API:',
                        resposta
                    );


                    throw new Error(
                        `Erro HTTP ${res.status}`
                    );

                }



                alert(

                    novoStatus === 'confirmado'

                    ?

                    'Agendamento confirmado com sucesso!'

                    :

                    'Agendamento cancelado com sucesso!'

                );



                // Atualiza a tabela
                await carregarAgendamentos();


            }

            catch (error) {


                console.error(
                    'Erro ao alterar status:',
                    error
                );


                alert(
                    'Não foi possível atualizar o status do agendamento.'
                );

            }

        }



        // =========================================================
        // INICIAR PAINEL
        // =========================================================

        carregarAgendamentos();


    </script>


</body>

</html>
